# Don't forget to surround abstract with double quotes
abstract: "We reproduce VAECox (Kim et al., Bioinformatics 2020), a transfer-learning
           survival model that pretrains a variational autoencoder on pan-cancer
           RNA-seq and fine-tunes its encoder inside a Cox proportional-hazards
           network. Using open-access TCGA data from the UCSC Xena hub (35 cohorts,
           10,993 patients, 20,530 genes), we retrain the full pipeline and compare
           it with CoxLasso, CoxRidge, Cox-nnet and a Cox MLP over 10 random splits
           of the paper's 10 evaluation cancers. VAECox obtains the highest mean
           C-index (0.648 vs 0.638-0.646) and wins 5 of 10 cancers rather than the
           7 reported; the per-cancer margins are one order of magnitude smaller
           than the seed-to-seed standard deviation, so the paper's ranking is only
           partially replicated. We extend the study with robustness,
           feature-budget, lightweight-model, subgroup-fairness and
           risk-stratification analyses."

